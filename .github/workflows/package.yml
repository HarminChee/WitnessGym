name: Prepare code-only release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff check src/witnessgym scripts tests --select E9,F
      - run: python -m pytest
      - run: python scripts/package_code.py --output "$RUNNER_TEMP/WitnessGym-code.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WitnessGym-code
          path: ${{ runner.temp }}/WitnessGym-code.zip
          if-no-files-found: error
          retention-days: 7
