name: Code and skill checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff check src/witnessgym scripts tests --select E9,F
      - run: python scripts/check_release.py
      - run: python -m pytest
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: witnessgym --version
      - run: python scripts/install_skill.py --destination "$RUNNER_TEMP/skills"
      - run: python "$RUNNER_TEMP/skills/witnessgym/runtime/scripts/smoke.py" --language python --output "$RUNNER_TEMP/installed-smoke"
