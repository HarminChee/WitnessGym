name: Code and skill checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff check src/witnessgym scripts tests --select E9,F
      - run: python scripts/check_release.py
      - run: python -m pytest
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: witnessgym --version
      - run: python scripts/install_skill.py --destination "$RUNNER_TEMP/skills"
      - run: python "$RUNNER_TEMP/skills/witnessgym/runtime/scripts/smoke.py" --language python --output "$RUNNER_TEMP/installed-smoke"
